name: flutter

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
  # 出包只走 tag 或手动触发，不在分支上跑。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Public dependencies
        run: flutter pub get

      - name: Static analysis (must be zero issues)
        run: flutter analyze

      - name: Unit / golden / migration tests (full variant)
        run: flutter test --reporter expanded

      # 只记工时变体走的是编译期开关，代码路径不同，必须单独跑一遍测试。
      - name: Unit / golden / migration tests (hours-only variant)
        run: flutter test --reporter expanded --dart-define=HOURS_ONLY=true

  build:
    # 只有打 tag 或手动触发才出包：分支上跑测试就够了。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # Gradle 读的是 flutter_app/android/keystore.properties，不读环境变量。
      # 这里把 secrets 落成文件；缺密钥就失败，绝不产出 debug 签名包。
      - name: Install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64。CI 不产出 debug 签名包——那会让已安装用户无法覆盖升级。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/myhours-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=myhours-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      - name: Build full release APKs (per ABI)
        run: flutter build apk --release --flavor full --split-per-abi

      # hours 变体靠 --dart-define=HOURS_ONLY 切功能，缺了就会产出
      # 「名字叫工时版、功能是完整版、数据写进独立 applicationId」的错包。
      - name: Build hours-only release APKs (per ABI)
        run: >
          flutter build apk --release --flavor hours
          --dart-define=HOURS_ONLY=true --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
